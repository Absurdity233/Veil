# Veil relay.
#
# The relay only routes opaque ciphertext, so the container needs no secrets
# and no external database: one volume for the SQLite file is the whole state.

services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: veil-relay:latest
    container_name: veil-relay
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - veil-data:/data
    environment:
      VEIL_ADDR: ":8080"
      VEIL_DB: "/data/veil.db"
    healthcheck:
      # The image is distroless: no shell, no curl, no wget. The relay binary
      # is the only thing guaranteed to exist in there, so it probes itself.
      # This checks /health, not just the port, because a bound port says
      # nothing about whether the SQLite store is usable.
      test: ["CMD", "/usr/local/bin/veil-relay", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  veil-data:
