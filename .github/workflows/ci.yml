name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs write access to the repository, and a workflow that can
# push is a workflow worth compromising.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The crypto core, on a Linux runner with CMake. This is the suite that
  # matters most and the one that used to be unrunnable on a fresh clone,
  # because the build script lived under build/, which .gitignore excludes.
  host:
    name: protocol core (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify vendored Monocypher
        run: sh core-native/src/main/cpp/third_party/verify.sh

      - name: Configure
        run: cmake -S core-native/host -B build/host -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/host --parallel

      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  # The same code under the sanitizers. The parsers take bytes from the
  # network; a length check that is off by one is a memory-safety bug, and the
  # ordinary build would not notice.
  sanitizers:
    name: protocol core (asan+ubsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S core-native/host -B build/asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build/asan --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/asan --output-on-failure

  # Short libFuzzer runs. Not a substitute for a corpus-backed campaign; they
  # do catch the obvious "malformed length crashes the parser" class on every
  # push, which is the class that matters here.
  fuzz:
    name: fuzz parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Check the source list is complete
        run: |
          # Every .cpp under veil/ that the engine itself needs has to appear in
          # the compile line below, or the fuzzer links against a partial engine
          # and fails with an undefined reference to a symbol only some code path
          # reaches. That is how group.cpp went missing: the unit tests do not
          # exercise every symbol the engine references, so the ordinary build
          # stayed green while this one did not link.
          #
          # veil_c.cpp is excluded by name: it is the other language binding, not
          # part of the engine, and the fuzzer drives the C++ API directly.
          missing=0
          for f in core-native/src/main/cpp/veil/*.cpp; do
            base=$(basename "$f")
            case "$base" in
              veil_c.cpp) continue ;;
            esac
            if ! grep -q "veil/$base" .github/workflows/ci.yml; then
              echo "::error::veil/$base is not in the fuzzer's compile line"
              missing=1
            fi
          done
          exit $missing

      - name: Build fuzzer
        run: |
          # Every translation unit the engine needs, listed explicitly because
          # this build does not go through CMake. The list was missing
          # group.cpp, so the link failed on `GroupMembership::signedPayload`
          # - a symbol only group messages and invitations reach, which is why
          # the ordinary unit-test build did not surface it.
          clang++ -g -O1 -std=c++17 -fsanitize=fuzzer,address \
            -Icore-native/src/main/cpp \
            -Icore-native/src/main/cpp/third_party/monocypher \
            core-native/host/fuzz/fuzz_parsers.cpp \
            core-native/src/main/cpp/veil/crypto.cpp \
            core-native/src/main/cpp/veil/keys.cpp \
            core-native/src/main/cpp/veil/random.cpp \
            core-native/src/main/cpp/veil/ratchet.cpp \
            core-native/src/main/cpp/veil/group.cpp \
            core-native/src/main/cpp/veil/engine.cpp \
            core-native/src/main/cpp/third_party/monocypher/monocypher.c \
            core-native/src/main/cpp/third_party/monocypher/monocypher-ed25519.c \
            -o build-fuzz-parsers

      - name: Fuzz
        run: ./build-fuzz-parsers -max_total_time=90 -max_len=4096

  # The same C ABI the desktop and web clients call. Tested through the header,
  # with the caller owning every buffer, because that is how JNA and the wasm
  # build both use it.
  c-abi:
    name: C ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S core-native/host -B build/host -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/host --parallel

      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  # The desktop client. It reaches the engine through JNA rather than JNI, which
  # is the point: same C ABI, different language binding.
  desktop:
    name: desktop client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build the C ABI library
        run: |
          cmake -S desktop -B build/abi -DCMAKE_BUILD_TYPE=Release
          cmake --build build/abi --parallel
          echo "--- where it landed ---"
          find build/abi -name 'libveilc*' -o -name 'veilc*' | head
          # The exported symbols, because a JNA UnsatisfiedLinkError is the same
          # error whether the file is missing, unloadable, or present with every
          # entry point hidden. Printing this separates those three.
          echo "--- exported veil_ symbols ---"
          nm -D --defined-only build/abi/libveilc.so 2>/dev/null | grep -c ' T veil_' || echo 0
          nm -D --defined-only build/abi/libveilc.so 2>/dev/null | grep ' T veil_' | head -5 || true

      - name: Build the relay the tests start
        run: |
          mkdir -p build/relay
          cd server && go build -trimpath -o ../build/relay/veil-relay .

      - name: Test
        run: |
          chmod +x gradlew
          # What the Gradle task staged, before the tests ask JNA to load it.
          echo "--- staged ---"
          find desktop/build/native -type f 2>/dev/null || echo "(nothing staged)"
          ./gradlew :desktop:test --console=plain

  # The web client: the engine compiled to wasm, plus the TypeScript that drives
  # it. The e2e tests start the real relay and run a real handshake.
  web:
    name: web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the wasm module
        run: npm run build:wasm

      # The tests import from dist/, so the compiler has to emit - `--noEmit`
      # type-checks and produces nothing, which is why every web job failed with
      # "Cannot find module dist/app.js". The check and the emit are separate
      # steps so a type error is reported as itself rather than as a missing
      # module four steps later.
      - name: Type-check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Compile for the tests
        run: npx tsc -p tsconfig.json

      - name: Bundle
        run: npm run build:bundle

      - name: Build the relay the tests start
        working-directory: .
        run: |
          mkdir -p build/relay
          cd server && go build -trimpath -o ../build/relay/veil-relay .

      # The file list is explicit rather than a directory: `node --test test/`
      # does not recurse, and a new suite that nobody adds here would sit in the
      # repository never running. That is exactly what happened to the selection,
      # QR and account suites - they were written, passed locally, and were not
      # in this line.
      - name: Test
        run: |
          node --test --test-timeout=60000 \
            test/wire.test.mjs \
            test/wasm.test.mjs \
            test/selection.test.mjs \
            test/qr.test.mjs \
            test/account.test.mjs \
            test/notify.test.mjs \
            test/e2e.test.mjs

      # A guard for the problem above: the suites this job runs must be the
      # suites that exist. Adding a test file without adding it to the run is a
      # silent gap, and this turns it into a red build.
      #
      # The source of truth is package.json's own test script, so there is one
      # list rather than two that can drift. `npm test` and this step read the
      # same line.
      - name: Every test file is run
        run: |
          # Compare as sorted lists: the order in the script is the order the
          # suites were written, and requiring the filesystem to enumerate in that
          # order was the bug - `ls` sorts differently.
          on_disk=$(ls test/*.test.mjs | sort | tr '\n' ' ' | sed 's/ *$//')
          in_script=$(node -p "require('./package.json').scripts.test.match(/test\/[a-z0-9]+\.test\.mjs/g).sort().join(' ')")
          echo "on disk:   $on_disk"
          echo "in script: $in_script"
          if [ "$on_disk" != "$in_script" ]; then
            echo "::error::the suites on disk and the suites npm test runs differ"
            exit 1
          fi

      - name: Upload the wasm module
        uses: actions/upload-artifact@v4
        with:
          name: veil-wasm
          path: |
            web/public/wasm/veil.js
            web/public/wasm/veil.wasm

  relay:
    name: relay (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Fuzz (short)
        run: go test -run=XXX -fuzz=FuzzEnvelope -fuzztime=30s

      - name: Build
        run: go build -trimpath -o ../build/relay/veil-relay .

      - name: Upload relay binary
        uses: actions/upload-artifact@v4
        with:
          name: veil-relay-linux
          path: build/relay/veil-relay

  # The client wire code against a real relay process. Kept separate from the
  # Android build so a broken relay and a broken UI are distinguishable from
  # one failing job.
  interop:
    name: client/relay interop
    runs-on: ubuntu-latest
    needs: relay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build the relay the test starts
        run: |
          mkdir -p build/relay
          cd server && go build -trimpath -o ../build/relay/veil-relay .

      - name: Run the interop test
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --console=plain

  android:
    name: android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already carries an Android SDK and the NDK. Installing
      # them with setup-android was slower and broke: the action judged the
      # preinstalled cmdline-tools to be the wrong version, downloaded another,
      # and then failed on the NDK install. Using what is installed avoids both
      # the download and the version check that was wrong about it.
      - name: Locate the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/ndk" || true

      - name: Accept licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain

      # Lint is separate from assemble because the two fail for different
      # reasons, and a single step that does both makes the log say "build
      # failed" whether the code does not compile or merely has a warning.
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veil-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html